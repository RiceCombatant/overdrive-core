# ========================================================
# Overdrive Core - 4人対戦マルチプレイヤー設定 (network.ini)
# ========================================================
#
# [起動モードの指定 (mode)]
# - host   : ホスト（Player 1: クリムゾンレッド / 南側スポーン）として起動し、最大3人の参加を待ちます。
# - client : クライアント（Player 2〜4 / 参加順にスロット自動割り当て）として起動し、下記 ip に接続します。
# - none   : 単独練習起動（ゲーム起動後に H キーでホスト化、C キーでクライアント接続も可能）
mode = host

# [接続先ホストのIPアドレス (ip)]
# クライアントモード時、またはゲーム内「C」キーで接続するホストのIPアドレスを指定します。
# - 同一PC内で複数起動してテストする場合 : 127.0.0.1
# - 自宅の同一Wi-Fi / LAN内で対戦する場合 : ホストPCのローカルIP (例: 192.168.1.15)
# - インターネット経由（友達と対戦する場合） :
#     1. ホストのグローバルIP (ルーターのUDPポート7777を開放)
#     2. または Radmin VPN / Tailscale / ZeroTier などの無料仮想LANツールで表示されるホストのIP
ip = 127.0.0.1

# [通信ポート (port)]
# UDPポート番号（デフォルト: 7777）
port = 7777

# [4機体のカラー & スポーン位置]
# - Player 1 (Host) : クリムゾンレッド (南側 YAW: 0度)
# - Player 2 (Client 1): コバルトブルー (北側 YAW: 180度)
# - Player 3 (Client 2): アンバーゴールド (東側 YAW: 270度)
# - Player 4 (Client 3): エメラルドグリーン (西側 YAW: 90度)

